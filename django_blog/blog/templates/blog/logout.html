<!-- blog/templates/blog/logout.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - Django Blog</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .logout-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logout-title {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .logout-message {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-primary {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary {
            padding: 12px 30px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover, .btn-secondary:hover {
            opacity: 0.9;
        }

        form {
            display: inline;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <h2 class="logout-title">Logout</h2>

        <p class="logout-message">
            Are you sure you want to logout?
            {% if user.is_authenticated %}
            You are currently logged in as <strong>{{ user.username }}</strong>.
            {% endif %}
        </p>

        <div class="btn-group">
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn-primary">Yes, Logout</button>
            </form>

            <a href="{% url 'profile' %}" class="btn-secondary">Cancel</a>
        </div>
    </div>
</body>
</html>
