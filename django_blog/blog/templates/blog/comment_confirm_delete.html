<!-- blog/templates/blog/comment_confirm_delete.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Comment - Django Blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .delete-container {
            background: white;
            border-radius: 10px;
            padding: 2.5rem;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .delete-title {
            font-size: 1.8rem;
            color: #dc3545;
            margin-bottom: 1.5rem;
        }

        .comment-info {
            background: #f8f9fa;
            border-left: 4px solid #dc3545;
            padding: 1.5rem;
            margin: 2rem 0;
            text-align: left;
            border-radius: 4px;
        }

        .comment-post {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .comment-content {
            color: #333;
            line-height: 1.6;
            margin: 1rem 0;
            padding: 1rem;
            background: white;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .comment-author {
            color: #666;
            font-size: 0.9rem;
        }

        .warning-message {
            color: #856404;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            flex: 1;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            text-align: center;
            flex: 1;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .nav-links {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }

        .nav-links a {
            color: #007bff;
            text-decoration: none;
            margin: 0 0.5rem;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .delete-container {
                padding: 1.5rem;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="delete-container">
        <h2 class="delete-title">Delete Comment</h2>

        <div class="warning-message">
            ⚠️ Warning: This action cannot be undone!
        </div>

        <div class="comment-info">
            <div class="comment-post">
                <strong>Post:</strong> {{ object.post.title }}
            </div>
            <div class="comment-content">
                {{ object.content|linebreaks }}
            </div>
            <div class="comment-author">
                By {{ object.author.username }} • {{ object.created_at|date:"F d, Y" }}
            </div>
        </div>

        <p>Are you sure you want to delete this comment?</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn-danger">Yes, Delete Comment</button>
                <a href="{% url 'post-detail' object.post.pk %}" class="btn-secondary">Cancel</a>
            </div>
        </form>

        <div class="nav-links">
            <a href="{% url 'post-detail' object.post.pk %}">Back to Post</a>
            <a href="{% url 'home' %}">Home</a>
        </div>
    </div>
</body>
</html>
